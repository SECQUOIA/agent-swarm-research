[project]
name = "minlp-solver-lab"
version = "0.1.0"
description = "Solver algorithm experiments for the September 12 MINLP continuation (convex MINLP / GDP)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "gurobipy>=13,<14",
    "numpy>=2,<3",
    "scipy>=1.16,<2",
    "sympy>=1.14,<2",
    "pyomo>=6.9",
    "gamsapi[transfer]>=54",
    "pyscipopt>=5.5",
    "highspy>=1.11",
    "gdplib",
    "requests",
    "pandas>=2",
    "packaging>=26.3",
    "matplotlib>=3.11.2",
    "mpmath>=1.3.0",
    "python-flint>=0.9.0",
]

[tool.uv]
package = false

[tool.uv.sources]
gdplib = { path = "instances/gdplib_src", editable = true }
