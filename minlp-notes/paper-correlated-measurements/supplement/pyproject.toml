[project]
name = "correlated-measurements-supplement"
version = "1.0.0"
description = "Standalone verification and reproduction for correlated measurement selection"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "scipy>=1.16,<2", "sympy==1.14.0", "mpmath>=1.3,<2"]

[project.optional-dependencies]
proposals = ["gurobipy>=13,<14", "cvxpy==1.9.2", "clarabel==0.11.1"]

[tool.uv]
package = false
