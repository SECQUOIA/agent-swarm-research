version: 2
updates:
  - package-ecosystem: uv
    directory: /minlp-notes/code/minlp_solver_lab
    schedule:
      interval: daily
    # Keep security updates enabled without routine version-update PRs.
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
